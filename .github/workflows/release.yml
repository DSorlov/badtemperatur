name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Publish release asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync manifest version with tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          python - "$version" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path("custom_components/badtemperatur/manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["version"] = sys.argv[1]
          path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Create zip
        run: |
          cd custom_components/badtemperatur
          zip -r ../../badtemperatur.zip .

      - name: Attach zip to release
        uses: softprops/action-gh-release@v3
        with:
          files: badtemperatur.zip
