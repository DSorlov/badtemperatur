[project]
name = "badtemperatur"
version = "1.0.0"
description = "Home Assistant-integration för badtemperatur via Copernicus Marine (Sentinel-3)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "A",
    "ASYNC",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "ICN",
    "N",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "SLF",
    "T20",
    "TID",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "D203",
    "D213",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "PLR2004", "SLF001"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
